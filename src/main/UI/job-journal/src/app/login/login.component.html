<div class="container-fluid">
    <div id="ViewWrapper" class="popup">
        <div class="glassDiv centerFlex" id="outerDiv">
            <div class="glassBorder boxContent" id="innerDiv">
                
                <div class="alert alert-warning" data-bs-theme="dark" role="alert" *ngIf="invalidLogin">{{errorMsg}}</div>
                <form (ngSubmit)="authLogin()">
                    <fieldset>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" name="email" [(ngModel)]="email" id="email">
                        </div>
                    </fieldset>
                    
                    <fieldset>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" [(ngModel)]="password" id="password">
                        </div>
                    </fieldset>

                    <div class="d-flex flex-row-reverse ">
                        <button type="submit" class="btn btn-outline-success lexend-giga-semibold">Submit</button>
                    </div>

                </form>
  
  
            </div>
        </div>
    </div>
</div>
